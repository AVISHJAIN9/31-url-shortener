services:
  - type: web
    name: aj-url-shortener
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: UrlShortener-Clean-Project/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
